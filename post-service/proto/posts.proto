syntax = "proto3";
package posts;

import "google/protobuf/timestamp.proto";

service PostService {
    rpc CreatePost (CreatePostRequest) returns (Post) {}
}

message CreatePostRequest {
    string userId = 1;
    string title = 2;
    string content = 3;
}

message Post {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}